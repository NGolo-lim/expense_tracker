<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать трату</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Редактировать запись #{{ expense['id'] }}</h3>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Дата</label>
                        <input type="date" name="date" class="form-control" value="{{ expense['date'] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сумма</label>
                        <input type="number" step="any" name="amount" class="form-control" value="{{ expense['amount'] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Категория</label>
                        <input type="text" name="category" class="form-control" value="{{ expense['category'] }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Комментарий</label>
                        <input type="text" name="description" class="form-control" value="{{ expense['description'] }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Способ оплаты</label>
                        <input type="text" name="payment_method" class="form-control" value="{{ expense['payment_method'] }}">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
